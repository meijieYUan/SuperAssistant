spring:
  application:
    name: super-assistant-app

  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration

  ai:
    dashscope:
      api-key: ${EMBEDDING_KEY}

    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

    mcp:
      client:
        enabled: true
        name: super-assistant
        version: 1.0.0
        type: SYNC
        toolcallback:
          enabled: true
        sse:
          connections:
            email-server:
              url: http://localhost:8081
              sse-endpoint: /sse

  datasource:
    url: jdbc:mysql://localhost:3306/superassistant
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

server:
  port: 8080

rag:
  retrieval:
    vector:
      top-k: 5
      similarity-threshold: 0.7
    bm25:
      top-k: 10
      index-path: ./data/bm25-index
    fusion:
      top-k: 20
      rrf-k: 60
  rerank:
    enabled: true
    top-k: 5

agent:
  guard:
    # 模型调用异常兜底（重试 + 兜底回答）
    model-retry:
      max-attempts: 3
      initial-delay-ms: 500
      max-delay-ms: 8000
      backoff-multiplier: 2.0
    # 工具调用异常兜底（重试 + 优雅降级）
    tool-retry:
      max-retries: 2
      initial-delay-ms: 300
      max-delay-ms: 3000
      backoff-factor: 2.0
    # 防死循环
    loop:
      max-model-calls-per-run: 15
      max-model-calls-per-thread: 60
      max-total-tool-calls: 60
      max-identical-calls: 3
