spring:
  application:
    name: super-assistant-app

  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration

  ai:
    dashscope:
      api-key: ${EMBEDDING_KEY}

    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

    mcp:
      client:
        enabled: true
        name: super-assistant
        version: 1.0.0
        type: SYNC
        toolcallback:
          enabled: true
        sse:
          connections:
            email-server:
              url: http://localhost:8081
              sse-endpoint: /sse

  datasource:
    url: jdbc:mysql://localhost:3306/superassistant
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

server:
  port: 8080
